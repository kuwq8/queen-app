# Render.com IaC Configuration
# This file must be in the root directory

services:
  - type: web
    name: gemini-social-backend
    env: node
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gemini-social-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://gemini-social.onrender.com

  - type: web
    name: gemini-social-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://gemini-social-backend.onrender.com

databases:
  - name: gemini-social-db
    databaseName: gemini_social
    user: admin
